{% from "_macros.html" import thumb %}
<li class="recipe-row{% if saved %} flash{% endif %}" id="r-{{ r.slug }}">
  {{ thumb(r.id, r.image) }}
  <div class="recipe-main">
    <div class="recipe-name">{{ r.name }}</div>
    <div class="recipe-sub muted">{% if r.servings %}{{ r.servings | round | int }} servings{% else %}Servings not set{% endif %}{% if not r.image %} · no image{% endif %}</div>
  </div>
  <div class="recipe-controls" hx-target="#r-{{ r.slug }}" hx-swap="outerHTML">
    <button type="button" class="switch" role="switch" aria-checked="{{ 'true' if r.is_dinner else 'false' }}"
            hx-post="/recipes/{{ r.slug }}/dinner" hx-vals='{"value": "{{ 0 if r.is_dinner else 1 }}"}'
            aria-label="Dinner: {{ r.name }}">
      <span class="switch-track"><span class="switch-knob"></span></span>
      <span class="switch-label">Dinner</span>
    </button>
    <div class="effort-group" role="group" aria-label="Effort for {{ r.name }}">
      <span class="effort-caption">Effort</span>
      {% for n in range(1, 6) %}
      <button type="button" class="effort-btn{% if r.effort == n %} is-on e{{ n }}{% endif %}" aria-pressed="{{ 'true' if r.effort == n else 'false' }}"
              hx-post="/recipes/{{ r.slug }}/effort" hx-vals='{"effort": "{{ '' if r.effort == n else n }}"}'
              title="{{ n }}: {{ effort_labels[n] }}{% if r.effort == n %} (tap to clear){% endif %}" aria-label="Effort {{ n }}, {{ effort_labels[n] }}">{{ n }}</button>
      {% endfor %}
    </div>
  </div>
</li>
